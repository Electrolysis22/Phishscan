<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phishing URL Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#fff;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  background:
    radial-gradient(ellipse 80% 48% at 50% 26%,#2b61d4 0%,#1e48a8 30%,#0b1a48 62%,transparent 88%),
    radial-gradient(ellipse 62% 30% at 50% 82%,rgba(37,99,235,.55) 0%,transparent 72%),
    #01030a;
  background-repeat:no-repeat;
}
main{max-width:1100px;margin:0 auto;padding:72px 20px 90px}
h1{
  margin:0 0 14px;text-align:center;font-weight:700;
  font-size:clamp(2.1rem,5.6vw,4.2rem);letter-spacing:-.02em;line-height:1.1;
}
.sub{
  margin:0 0 52px;text-align:center;color:#a9b8da;font-weight:500;
  font-size:clamp(.95rem,1.6vw,1.2rem);
}
.shell{
  padding:18px;margin-bottom:26px;border-radius:28px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(140,175,255,.18);
}
.card{
  background:#000;border-radius:22px;padding:26px;
  border:1px solid rgba(255,255,255,.06);
}
#u{
  display:block;width:100%;background:none;border:0;outline:none;
  color:#fff;caret-color:#fff;font:inherit;font-weight:500;
  font-size:clamp(1.05rem,2vw,1.55rem);padding:8px 0;
}
#u::placeholder{color:#5f6675}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:26px}
.tab{
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 22px;border-radius:999px;font:inherit;font-weight:500;font-size:1.05rem;
  color:#fff;background:linear-gradient(180deg,#1a3a8c,#0f2663);border:1px solid #2f5fd4;
  cursor:default;
}
.tab svg{width:18px;height:18px}
.send{
  margin-left:auto;width:56px;height:56px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#1d44a3,#0f2766);border:1px solid #2f5fd4;
}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.55;cursor:wait}
#msg{min-height:22px;margin:16px 4px 0;color:#a9b8da;font-size:.95rem;line-height:1.5}
#msg.err{color:#f2a1a1}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.head h2{margin:0;font-size:1.6rem;font-weight:700}
.head .btns{display:flex;align-items:center;gap:14px}
.round{
  width:64px;height:48px;border-radius:999px;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#1d44a3,#0f2766);border:1px solid #2f5fd4;
}
.round svg{width:22px;height:22px}
.all{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  padding:0 26px;height:56px;border-radius:999px;font:inherit;font-weight:600;font-size:1.1rem;color:#fff;
  background:linear-gradient(180deg,#2a62d8,#1b45ad);border:1px solid #3d72e6;
}
.all svg{width:20px;height:20px}
.wrap{overflow-x:auto}
table{width:100%;min-width:680px;border-collapse:collapse}
th{
  text-align:left;padding:18px 14px;color:#8c8c95;font-weight:600;font-size:1.05rem;
  border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);
}
td{padding:16px 14px;font-size:1.1rem;color:#ececf0;border-bottom:1px solid rgba(255,255,255,.07)}
tr:last-child td{border-bottom:0}
.cat{display:flex;align-items:center;gap:14px;white-space:nowrap}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid #d4d4da;flex:none}
.asset{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{white-space:nowrap}
.status{
  display:inline-block;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.95rem;letter-spacing:.02em;
}
.status.safe{background:#233a1b;border:1px solid #3b5a2a;color:#bfe8a6}
.status.warn{background:#3a2b0f;border:1px solid #7a5a22;color:#f3d9a4}
.status.bad{background:#3a1013;border:1px solid #7a2227;color:#f3b9b9}
.empty{padding:34px 14px;color:#8c8c95;font-size:1.05rem}
button:focus-visible,#u:focus-visible{outline:2px solid #6c9bff;outline-offset:3px}
@media(max-width:640px){
  main{padding-top:48px}
  .card{padding:20px}
  .head{flex-wrap:wrap}
}
</style>
</head>
<body>
<main>
  <h1>Scan And Detect Phishing Links</h1>
  <p class="sub">Analyze any URL with a machine learning model trained on real phishing data</p>

  <section class="shell">
    <div class="card">
      <input id="u" type="text" autocomplete="off" spellcheck="false" placeholder="http://example.com/login" autofocus>
      <div class="bar">
        <span class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          URL Scan
        </span>
        <button class="send" id="send" type="button" aria-label="Scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        </button>
      </div>
      <div id="msg"></div>
    </div>
  </section>

  <section class="shell">
    <div class="card">
      <div class="head">
        <h2>Recent Scans</h2>
        <div class="btns">
          <button class="round" id="clear" type="button" title="Clear recent scans" aria-label="Clear recent scans">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button class="all" id="all" type="button">
            <span id="allText">View All Scans</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="wrap">
        <table>
          <thead><tr>
            <th>Category</th><th>Data Asset</th><th>Last Scanned On</th>
            <th title="Phishing risk out of 10">Score</th><th>Status</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let scans = [], showAll = false, busy = false;

const STATUS = {
  phishing:   {cls: 'bad',  text: 'PHISHING',   color: '#ef4444'},
  suspicious: {cls: 'warn', text: 'SUSPICIOUS', color: '#f59e0b'},
  legitimate: {cls: 'safe', text: 'SAFE',       color: '#34c759'}
};

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ring(score, color){
  const n = 10, r = 16, c = 20, gap = 0.16;
  let paths = '';
  for(let i = 0; i < n; i++){
    const a0 = -Math.PI/2 + i*2*Math.PI/n + gap;
    const a1 = -Math.PI/2 + (i+1)*2*Math.PI/n - gap;
    const x0 = c + r*Math.cos(a0), y0 = c + r*Math.sin(a0);
    const x1 = c + r*Math.cos(a1), y1 = c + r*Math.sin(a1);
    const col = i < score ? color : 'rgba(255,214,214,.92)';
    paths += '<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" fill="none"/>';
  }
  return '<svg width="44" height="44" viewBox="0 0 40 40">'+paths+
    '<text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="inherit">'+score+'</text></svg>';
}

function render(){
  const list = showAll ? scans : scans.slice(0, 5);
  $('allText').textContent = showAll ? 'Show Less' : 'View All Scans';
  if(!list.length){
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">No scans yet. Paste a URL above and press Enter.</td></tr>';
    return;
  }
  $('rows').innerHTML = list.map(s => {
    const st = STATUS[s.verdict] || STATUS.legitimate;
    return '<tr>'+
      '<td><div class="cat"><span class="cb"></span>URL Scan</div></td>'+
      '<td><div class="asset" title="'+esc(s.asset)+'">'+esc(s.asset)+'</div></td>'+
      '<td class="date">'+esc(s.date)+'</td>'+
      '<td>'+ring(s.score, st.color)+'</td>'+
      '<td><span class="status '+st.cls+'">'+st.text+'</span></td>'+
    '</tr>';
  }).join('');
}

function addScan(asset, risk, verdict){
  const date = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  scans.unshift({asset, date, score: Math.round(risk*10), verdict});
  render();
}

function say(text, isErr){
  $('msg').textContent = text || '';
  $('msg').className = isErr ? 'err' : '';
}

function setBusy(b){ busy = b; $('send').disabled = b; }

async function analyze(url){
  const r = await fetch('/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  if(!r.ok) throw new Error('Request failed');
  return r.json();
}

async function scanUrl(){
  const url = $('u').value.trim();
  if(!url){ say('Enter a URL to scan.', true); return; }
  setBusy(true); say('Analyzing the site. This can take up to 30 seconds...');
  try{
    const d = await analyze(url);
    addScan(url, d.phishing_probability, d.verdict);
    say(d.summary);
  }catch(e){
    say('Could not analyze this URL. Check that the server is running.', true);
  }
  setBusy(false);
}

$('send').onclick = () => { if(!busy) scanUrl(); };
$('u').addEventListener('keydown', e => { if(e.key === 'Enter' && !busy) scanUrl(); });
$('all').onclick = () => { showAll = !showAll; render(); };
$('clear').onclick = () => { scans = []; showAll = false; render(); say(''); };

render();
</script>
</body>
</html>
